name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          DIR=$(dirname "$(find . -name project.yml | head -1)")
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Create app icon catalog (all sizes)
        run: |
          cd "$DIR/Sources"
          D=Assets.xcassets/AppIcon.appiconset
          mkdir -p $D
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          JSON=""
          add() {
            px=$(python3 -c "print(int(round($2*$3)))")
            fn="icon-$1-$2@$3x.png"
            sips -z $px $px icon.png --out "$D/$fn" >/dev/null
            JSON="$JSON{\"filename\":\"$fn\",\"idiom\":\"$1\",\"scale\":\"$3x\",\"size\":\"$2x$2\"},"
          }
          for s in 2 3; do for p in 20 29 40 60; do add iphone $p $s; done; done
          for s in 1 2; do for p in 20 29 40 76; do add ipad $p $s; done; done
          add ipad 83.5 2
          cp icon.png $D/icon-1024.png
          JSON="$JSON{\"filename\":\"icon-1024.png\",\"idiom\":\"ios-marketing\",\"scale\":\"1x\",\"size\":\"1024x1024\"}"
          echo "{\"images\":[$JSON],\"info\":{\"author\":\"xcode\",\"version\":1}}" > $D/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd "$DIR" && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd "$DIR"
          xcodebuild -project EyeRest.xcodeproj -scheme EyeRest \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Add loose icon files for notifications
        run: |
          cd "$DIR"
          APP=build/Build/Products/Release-iphoneos/EyeRest.app
          mk() { sips -z $2 $2 Sources/icon.png --out "$APP/$1" >/dev/null; }
          mk "AppIcon20x20@2x.png" 40
          mk "AppIcon20x20@3x.png" 60
          mk "AppIcon29x29@2x.png" 58
          mk "AppIcon29x29@3x.png" 87
          mk "AppIcon40x40@2x.png" 80
          mk "AppIcon40x40@3x.png" 120
          mk "AppIcon60x60@2x.png" 120
          mk "AppIcon60x60@3x.png" 180
          mk "AppIcon20x20@2x~ipad.png" 40
          mk "AppIcon29x29@2x~ipad.png" 58
          mk "AppIcon40x40@2x~ipad.png" 80
          mk "AppIcon76x76@2x~ipad.png" 152
          mk "AppIcon83.5x83.5@2x~ipad.png" 167
          P="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy
          for K in CFBundleIcons "CFBundleIcons~ipad"; do $PB -c "Delete :$K" "$P" 2>/dev/null || true; done
          for K in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$K dict" "$P"
            $PB -c "Add :$K:CFBundlePrimaryIcon dict" "$P"
            $PB -c "Add :$K:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$P"
            $PB -c "Add :$K:CFBundlePrimaryIcon:CFBundleIconFiles array" "$P"
          done
          i=0; for n in AppIcon20x20 AppIcon29x29 AppIcon40x40 AppIcon60x60; do
            $PB -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:$i string $n" "$P"; i=$((i+1)); done
          i=0; for n in AppIcon20x20 AppIcon29x29 AppIcon40x40 AppIcon76x76 AppIcon83.5x83.5; do
            $PB -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles:$i string $n" "$P"; i=$((i+1)); done
          $PB -c "Print :CFBundleIcons" "$P"
          ls "$APP" | grep -i icon

      - name: Package IPA
        run: |
          cd "$DIR"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EyeRest.app Payload/
          zip -qr EyeRest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EyeRest-ipa
          path: ${{ env.DIR }}/EyeRest.ipa
