name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          DIR=$(dirname "$(find . -name project.yml | head -1)")
          echo "DIR=$DIR" >> $GITHUB_ENV
      - name: Create app icon catalog
        run: |
          cd "$DIR/Sources"
          python3 - <<'PY'
          import os, json, subprocess, shutil
          d = "Assets.xcassets/AppIcon.appiconset"
          os.makedirs(d, exist_ok=True)
          specs = [("iphone",20,2),("iphone",20,3),("iphone",29,2),("iphone",29,3),
                   ("iphone",40,2),("iphone",40,3),("iphone",60,2),("iphone",60,3),
                   ("ipad",20,1),("ipad",20,2),("ipad",29,1),("ipad",29,2),
                   ("ipad",40,1),("ipad",40,2),("ipad",76,1),("ipad",76,2),("ipad",83.5,2)]
          images = []
          for idiom, pt, sc in specs:
              px = int(round(pt * sc))
              fn = f"icon-{idiom}-{pt:g}@{sc}x.png"
              subprocess.run(["sips","-z",str(px),str(px),"icon.png","--out",f"{d}/{fn}"],
                             check=True, stdout=subprocess.DEVNULL)
              images.append({"filename":fn,"idiom":idiom,"scale":f"{sc}x","size":f"{pt:g}x{pt:g}"})
          shutil.copy("icon.png", f"{d}/icon-1024.png")
          images.append({"filename":"icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"})
          json.dump({"images":images,"info":{"author":"xcode","version":1}}, open(f"{d}/Contents.json","w"))
          json.dump({"info":{"author":"xcode","version":1}}, open("Assets.xcassets/Contents.json","w"))
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd "$DIR" && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd "$DIR"
          xcodebuild -project EyeRest.xcodeproj -scheme EyeRest \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          cd "$DIR"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EyeRest.app Payload/
          zip -qr EyeRest.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EyeRest-ipa
          path: ${{ env.DIR }}/EyeRest.ipa
